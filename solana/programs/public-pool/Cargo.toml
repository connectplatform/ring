[package]
name = "public-pool"
version = "0.1.0"
description = "Ring PublicPool escrow vault — contribute / finalize / refund"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "public_pool"

[features]
default = []
anchor-debug = []
custom-heap = []
custom-panic = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
