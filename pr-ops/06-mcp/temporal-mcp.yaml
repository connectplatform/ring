apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-mcp
  namespace: pr-ops
  labels:
    app: temporal-mcp
    app.kubernetes.io/part-of: pr-ops
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal-mcp
  template:
    metadata:
      labels:
        app: temporal-mcp
        app.kubernetes.io/part-of: pr-ops
        app.kubernetes.io/component: mcp-server
    spec:
      imagePullSecrets:
        - name: ghcr-connectplatform-ring
      containers:
        - name: temporal-mcp
          image: ghcr.io/connectplatform/ring/pr-ops/temporal-mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3300
          env:
            - name: PORT
              value: "3300"
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.pr-ops.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: pr-ops
          readinessProbe:
            httpGet:
              path: /health
              port: 3300
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3300
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-mcp
  namespace: pr-ops
  labels:
    app.kubernetes.io/part-of: pr-ops
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  selector:
    app: temporal-mcp
  ports:
    - name: http
      port: 3300
      targetPort: 3300
